[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dive-mri"
version = "2.0.0"
description = "Diffusion Visualization Explorer (DiVE) — interactive 3D viewer for tractography, ROIs, and meshes."
keywords = ["diffusion MRI", "along-tract visualization", "tractography", "white matter bundle"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.11,<3.14"
authors = [{ name = "Iyad Ba Gari", email = "iyad.bagari@usc.edu" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "dipy",
    "distinctipy",
    "fury>=0.11,<2",
    "imageio[pyav]",
    "matplotlib",
    "meta-neuro",
    "nibabel",
    "numpy",
    "pandas",
    "Pillow",
    "vtk>=9.3,<9.7",
    "pyvista>=0.45",
    "scipy",
    "tqdm",
    "trx-python",
    "tslearn",
    "webcolors",
]

[project.urls]
Homepage = "https://github.com/bagari/dive"

[project.scripts]
dive = "dive.workflows.dive:main"

[tool.setuptools.package-data]
dive = ["assets/*"]

[tool.setuptools.packages.find]
include = ["dive*"]

